---
# import: check mode (server dry run), real, repeat, schema refusal, kind refusal, tags, cleanup.
- module_defaults:
    group/git_cgallagher.inventory.inventory:
      url: "{{ ais_url }}"
      token: "{{ ais_token }}"
  vars:
    it_tree:
      variables:
        it_import_port: {merge_strategy: replace, json_schema: {type: integer, minimum: 1}}
      all:
        children:
          it_import:
            vars: {it_import_port: 7000}
            children:
              prod:
                children:
                  dc1:
                    hosts:
                      it-import01: {ansible_host: 10.77.0.1}
      tags:
        it_import_tag: {description: integration, members: [all.it_import.prod]}
  block:
    - name: Import in check mode
      git_cgallagher.inventory.import:
        tree: "{{ it_tree }}"
      check_mode: true
      diff: true
      register: chk
    - name: Nothing was written
      git_cgallagher.inventory.node_info:
        path: all.it_import
      register: after_chk
    - ansible.builtin.assert:
        that:
          - chk is changed
          - chk.nodes_created == 4
          - chk.variables_set == 2
          - chk.definitions == ['it_import_port']
          - chk.tags == ['it_import_tag']
          - chk.diff.after.nodes_created == 4
          - not after_chk.exists

    - name: Import
      git_cgallagher.inventory.import:
        tree: "{{ it_tree }}"
        revision_message: integration import
      register: imported
    - name: Import again
      git_cgallagher.inventory.import:
        tree: "{{ it_tree }}"
      register: again
    - name: Check mode on a matching tree
      git_cgallagher.inventory.import:
        tree: "{{ it_tree }}"
      check_mode: true
      register: chk_again
    - name: The tag holds the member
      ansible.builtin.uri:
        url: "{{ ais_url }}/api/v1/tags/it_import_tag"
        headers: {Authorization: "Bearer {{ ais_token }}"}
      register: tag
    - name: The host landed with its var
      git_cgallagher.inventory.node_info:
        path: all.it_import.prod.dc1.it-import01
      register: host
    - ansible.builtin.assert:
        that:
          - imported is changed
          - imported.nodes_created == 4
          - again is not changed
          - again.revision == imported.revision
          - again.nodes_created == 0
          - imported.tags == ['it_import_tag']
          - again.tags == []
          - chk_again is not changed
          - host.exists
          - host.node.vars.ansible_host == '10.77.0.1'
          - tag.json.members == ['all.it_import.prod']
          - tag.json.description == 'integration'

    - name: A value its json_schema rejects
      git_cgallagher.inventory.import:
        tree:
          all:
            children:
              it_import:
                vars: {it_import_port: "seven thousand"}
      register: bad_value
      ignore_errors: true
    - name: A kind that does not fit
      git_cgallagher.inventory.import:
        tree:
          all:
            children:
              it_import:
                kind: tier
      register: bad_kind
      ignore_errors: true
    - name: Nothing changed
      git_cgallagher.inventory.node_info:
        path: all.it_import
      register: unchanged
    - ansible.builtin.assert:
        that:
          - bad_value is failed
          - "'json_schema' in bad_value.msg"
          - bad_kind is failed
          - bad_kind.status == 422
          - unchanged.node.vars.it_import_port == 7000
  always:
    - name: Cleanup the subtree
      git_cgallagher.inventory.node:
        path: all.it_import
        state: absent
        recursive: true
    - name: Current revision for the tag cleanup
      ansible.builtin.uri:
        url: "{{ ais_url }}/api/v1/revisions?limit=1"
        headers: {Authorization: "Bearer {{ ais_token }}"}
      register: revs
    - name: Cleanup the tag (there is no tag module)
      ansible.builtin.uri:
        url: "{{ ais_url }}/api/v1/tags/it_import_tag"
        method: DELETE
        headers:
          Authorization: "Bearer {{ ais_token }}"
          If-Match: '"{{ revs.json[0].id }}"'
        status_code: [200, 404]
    - name: Cleanup the definition
      git_cgallagher.inventory.variable_definition:
        name: it_import_port
        state: absent
