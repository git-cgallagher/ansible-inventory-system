---
# node: check mode, create, repeat, converge vars/meta/inventory_name, purge, failures, delete.
- module_defaults:
    group/git_cgallagher.inventory.inventory:
      url: "{{ ais_url }}"
      token: "{{ ais_token }}"
  block:
    - name: Create in check mode
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        vars: {redis_port: 6379}
        meta: {owner: it}
      check_mode: true
      diff: true
      register: chk
    - name: Nothing was written
      git_cgallagher.inventory.node_info:
        path: all.commercial.prod.dc1.it_cache
      register: after_chk
    - ansible.builtin.assert:
        that:
          - chk is changed
          - chk.diff.after.vars.redis_port == 6379
          - chk.impact.total == 0  # a new group holds no host
          - not after_chk.exists

    - name: Create
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        vars: {redis_port: 6379}
        meta: {owner: it}
        revision_message: integration node
      register: created
    - name: Create again
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        vars: {redis_port: 6379}
        meta: {owner: it}
      register: again
    - ansible.builtin.assert:
        that:
          - created is changed
          - created.node.kind == 'group'
          - created.node.vars.redis_port == 6379
          - again is not changed
          - again.revision == created.revision

    - name: Converge (new var, changed var, inventory_name, meta) in check mode
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        vars: {redis_port: 6380, packages: [redis]}
        inventory_name: dc1_cache
        meta: {owner: platform}
      check_mode: true
      register: chk2
    - name: Converge for real
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        vars: {redis_port: 6380, packages: [redis]}
        inventory_name: dc1_cache
        meta: {owner: platform}
      register: conv
    - name: Converge again
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        vars: {redis_port: 6380, packages: [redis]}
        inventory_name: dc1_cache
        meta: {owner: platform}
      register: conv2
    - ansible.builtin.assert:
        that:
          - chk2 is changed
          - conv is changed
          - conv.node.inventory_name == 'dc1_cache'
          - conv.node.meta.owner == 'platform'
          - conv.node.vars.redis_port == 6380
          - conv.node.vars.packages == ['redis']
          - conv2 is not changed

    - name: Purge removes the var not listed
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        vars: {redis_port: 6380}
        purge_vars: true
      register: purged
    - ansible.builtin.assert:
        that:
          - purged is changed
          - "'packages' not in purged.node.vars"
          - purged.diff.before.vars.packages == ['redis']

    - name: A host under the group needs kind host
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache.it_cache01
        kind: host
        vars: {ansible_host: 10.1.3.11}
      register: host_created

    - name: Failure - existing node of another kind
      git_cgallagher.inventory.node:
        path: all.commercial.prod
        kind: business
      register: wrong_kind
      ignore_errors: true
    - name: Failure - parent does not exist
      git_cgallagher.inventory.node:
        path: all.nope.child
      register: no_parent
      ignore_errors: true
    - name: Failure - stale expect_revision is a 409
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        vars: {redis_port: 1}
        expect_revision: 1
      register: stale
      ignore_errors: true
    - name: Failure - name collision with a sibling (server 409, not a stale revision)
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        inventory_name: commercial_prod_dc1_web
      register: collision
      ignore_errors: true
    - ansible.builtin.assert:
        that:
          - host_created is changed and host_created.node.kind == 'host'
          - wrong_kind is failed and 'kind' in wrong_kind.msg
          - no_parent is failed and 'does not exist' in no_parent.msg
          - stale is failed and stale.status == 409 and stale.current_revision > 1 and 'moved' in stale.msg
          - collision is failed and collision.status == 409 and 'collision' in collision.msg

    - name: Delete a group with a child, without recursive (refused)
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        state: absent
      register: refused
      ignore_errors: true
    - name: The same in check mode (the server's dry run refuses too)
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        state: absent
      check_mode: true
      register: refused_chk
      ignore_errors: true
    - name: Delete in check mode, with diff
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        state: absent
        recursive: true
      check_mode: true
      diff: true
      register: del_chk
    - name: Still there
      git_cgallagher.inventory.node_info:
        path: all.commercial.prod.dc1.it_cache.it_cache01
      register: still
    - name: Delete
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        state: absent
        recursive: true
      register: deleted
    - name: Delete again
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_cache
        state: absent
        recursive: true
      register: deleted2
    - ansible.builtin.assert:
        that:
          - refused is failed and refused.status == 409
          - "'1 node(s) below it' in refused.msg and 'recursive=true' in refused.msg"
          - refused.nodes == 2 and refused.hosts == 1
          - refused_chk is failed and refused_chk.status == 409
          - del_chk is changed
          - del_chk.deleted == ['all.commercial.prod.dc1.it_cache', 'all.commercial.prod.dc1.it_cache.it_cache01']
          - del_chk.diff.before.deleted | length == 2
          - del_chk.impact.removed == 1 and del_chk.impact.hosts[0].host == 'it_cache01'
          - "'1 removed' in del_chk.diff.prepared"
          - still.exists
          - deleted is changed
          - deleted.deleted | length == 2
          - deleted2 is not changed
    - name: A leaf needs no recursive
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_leaf
      register: leaf
    - name: Delete the leaf
      git_cgallagher.inventory.node:
        path: all.commercial.prod.dc1.it_leaf
        state: absent
      register: leaf_deleted
    - ansible.builtin.assert:
        that:
          - leaf is changed
          - leaf_deleted is changed and leaf_deleted.deleted == ['all.commercial.prod.dc1.it_leaf']
  always:
    - name: Cleanup
      git_cgallagher.inventory.node:
        path: "{{ item }}"
        state: absent
        recursive: true
      loop:
        - all.commercial.prod.dc1.it_cache
        - all.commercial.prod.dc1.it_leaf
