---
- module_defaults:
    group/git_cgallagher.inventory.inventory:
      url: "{{ ais_url }}"
      token: "{{ ais_token }}"
  block:
    - name: Set in check mode
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: it_feature_flag
        value: {enabled: true, pct: 10}
      check_mode: true
      diff: true
      register: chk
    - name: Not written
      git_cgallagher.inventory.node_info:
        path: all.commercial.lab
      register: lab
    - name: Set
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: it_feature_flag
        value: {enabled: true, pct: 10}
      register: set1
    - name: Set again (same JSON value)
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: it_feature_flag
        value: {pct: 10, enabled: true}
      register: set2
    - name: Change
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: it_feature_flag
        value: {enabled: false, pct: 0}
      diff: true
      register: set3
    - name: It resolves on a lab host
      git_cgallagher.inventory.render_info:
        host: lab-web01
      register: rendered
    - name: Failure - unknown node
      git_cgallagher.inventory.variable:
        path: all.nope
        key: x
        value: 1
      register: nope
      ignore_errors: true
    - name: Failure - present without a value
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: x
      register: novalue
      ignore_errors: true
    - name: Remove in check mode
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: it_feature_flag
        state: absent
      check_mode: true
      register: rm_chk
    - name: Remove
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: it_feature_flag
        state: absent
      register: rm
    - name: Remove again
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: it_feature_flag
        state: absent
      register: rm2
    - ansible.builtin.assert:
        that:
          - chk is changed and chk.diff.after.it_feature_flag.pct == 10
          - "'it_feature_flag' not in lab.node.vars"
          - set1 is changed and set1.value.enabled
          - set2 is not changed and set2.revision == set1.revision
          - set3 is changed and set3.diff.before.it_feature_flag.pct == 10 and set3.revision == set1.revision + 1
          - rendered.resolved.it_feature_flag.pct == 0
          - nope is failed and 'does not exist' in nope.msg
          - novalue is failed
          - rm_chk is changed and rm is changed and rm2 is not changed
          - set1.key_warnings == [] and set3.key_warnings == []

    # Issue 24: an undeclared key one swap away from the declared "packages" (seed.yml) is
    # written, with an Ansible warning and the details in key_warnings.
    - name: Near miss in check mode (nothing written, nothing to warn about)
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: pakcages
        value: [it-tool]
      check_mode: true
      register: typo_chk
    - name: Near miss of a declared key
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: pakcages
        value: [it-tool]
      register: typo
    - name: Same value again (no write, no warning)
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: pakcages
        value: [it-tool]
      register: typo_again
    - ansible.builtin.assert:
        that:
          - typo_chk is changed and typo_chk.key_warnings == []
          - typo is changed
          - typo.key_warnings | length == 1
          - typo.key_warnings[0].key == 'pakcages'
          - typo.key_warnings[0].path == 'all.commercial.lab'
          - typo.key_warnings[0].did_you_mean == 'packages'
          - typo.key_warnings[0].declared
          - typo.warnings | select('search', 'did you mean packages') | list | length == 1
          - typo_again is not changed and typo_again.key_warnings == []
  always:
    - name: Cleanup
      git_cgallagher.inventory.variable:
        path: all.commercial.lab
        key: "{{ item }}"
        state: absent
      loop: [it_feature_flag, pakcages]
