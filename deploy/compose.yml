# docker compose -f deploy/compose.yml up --build
# Dev-only credentials (example-not-secret); production uses SSM/env injection.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ais
      POSTGRES_PASSWORD: ais
      POSTGRES_DB: ais
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ais"]
      interval: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AIS_DATABASE_URL: postgresql+psycopg://ais:ais@db:5432/ais
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
