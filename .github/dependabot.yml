# Keeps the SHA-pinned actions in .github/workflows current (Dependabot updates the SHA and the
# version comment together) and the server's Python dependency floors.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
