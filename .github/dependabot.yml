# Keeps the SHA-pinned actions in .github/workflows current (Dependabot updates the SHA and the
# version comment together), the server's Python dependency floors and the web UI's npm packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    ignore:
      # ansible-core 2.21 does not import on Python 3.15 (it patches the removed private
      # dataclasses._is_type). Lift this once an ansible-core release supports 3.15.
      - dependency-name: python
        versions: [">=3.15"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
