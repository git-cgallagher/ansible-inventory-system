name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    # The whole suite runs a second time on PostgreSQL (ltree, JSONB, revision ids that are not
    # contiguous): a throwaway database for this job only, placeholder credentials.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ais
          POSTGRES_PASSWORD: ais
          POSTGRES_DB: ais_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ais -d ais_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e './server[test,postgres]'
      - name: Unit, export and Ansible parity tests
        working-directory: server
        run: python -m pytest -q
      - name: The same tests on PostgreSQL 16
        working-directory: server
        env:
          AIS_TEST_DATABASE_URL: postgresql+psycopg://ais:ais@127.0.0.1:5432/ais_test
        run: python -m pytest -q
      - name: Plugin smoke (ansible-inventory --graph against the API, bearer token from AIS_TOKEN)
        working-directory: examples
        env:
          AIS_DATABASE_URL: sqlite:///./ci.db
        run: |
          ais import seed.yml
          ais user create ci@example.com --role viewer --no-password
          AIS_TOKEN="$(ais token create --user ci@example.com --name ci)"
          export AIS_TOKEN
          ais serve --port 8000 & echo $! > /tmp/ais.pid
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8000/healthz >/dev/null && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/export)" = 401
          ansible-inventory --graph
          ansible-inventory --host web02 | grep -q tcpdump
          ansible-inventory --list >/dev/null   # second run revalidates with If-None-Match
          kill "$(cat /tmp/ais.pid)"

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API image
        run: docker build -f deploy/Dockerfile -t ais:ci .
      # A build alone passed with python:3.15-slim while the API could not start (ansible-core
      # 2.21 does not import on 3.15). Start the image on SQLite and require /healthz and the UI.
      - name: Start the image and check it serves
        run: |
          docker run -d --name ais-ci -p 127.0.0.1:8000:8000 -e AIS_DATABASE_URL=sqlite:////tmp/ci.db ais:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/healthz >/dev/null && break; sleep 1; done
          if ! curl -sf http://127.0.0.1:8000/healthz; then docker logs ais-ci; exit 1; fi
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker exec ais-ci ais snapshots status

  collection:
    name: collection
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the server (brings ansible-core and ansible-test)
        run: python -m pip install -e './server[test]'
      - name: ansible-test sanity
        working-directory: collection/ansible_collections/git_cgallagher/inventory
        run: ansible-test sanity --requirements --python 3.12 --color no
      - name: ansible-test units (module logic against a fake server, no API needed)
        working-directory: collection/ansible_collections/git_cgallagher/inventory
        run: ansible-test units --requirements --python 3.12 --color no
      - name: Serve the seed tree and mint an editor token for the modules
        working-directory: examples
        env:
          AIS_DATABASE_URL: sqlite:///./ci-collection.db
        run: |
          ais import seed.yml
          ais user create it@example.com --role editor --no-password
          AIS_TOKEN="$(ais token create --user it@example.com --name integration)"
          test "$(printf %s "$AIS_TOKEN" | wc -c)" -gt 20
          printf 'ais_url: http://127.0.0.1:8000\nais_token: %s\n' "$AIS_TOKEN" \
            > ../collection/ansible_collections/git_cgallagher/inventory/tests/integration/integration_config.yml
          ais serve --port 8000 & echo $! > /tmp/ais-collection.pid
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8000/healthz >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8000/healthz
      - name: ansible-test integration (every module - check, real, repeat, failure)
        working-directory: collection/ansible_collections/git_cgallagher/inventory
        run: ansible-test integration --requirements --python 3.12 --color no
      - name: Stop the server
        if: always()
        run: test -f /tmp/ais-collection.pid && kill "$(cat /tmp/ais-collection.pid)" || true

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the server (the smoke test runs a real ais serve)
        run: python -m pip install -e './server[test]'
      - name: Install the UI dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build (writes server/ais/static)
        working-directory: web
        run: npm run build
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke (login, tree, edit with a 409, render, diff, audit on the seed tree)
        working-directory: web
        run: npx playwright test
      - name: Keep the Playwright report when the smoke fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
