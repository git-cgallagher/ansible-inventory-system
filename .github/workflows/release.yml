name: release

# Publishes the collection (collection/ansible_collections/git_cgallagher/inventory) as a
# GitHub release. It is never published to Ansible Galaxy (owner decision, 2026-11-01).
#
# Every push to main reads `version` from the collection's galaxy.yml. When no GitHub release
# v<version> exists yet, it builds the collection and creates that release with the tarball:
#   * no tag v<version> yet: the tag is created on this commit;
#   * the tag already exists (v0.2.0 was tagged by hand): the tarball is built from the tag's
#     tree, so the release always matches its tag.
# A collection change reaches a release only when its PR bumps `version` in galaxy.yml; merges
# that don't are a no-op here (with a notice when the collection changed since the tag).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the GitHub release and, for a new version, its tag
    env:
      COLLECTION: collection/ansible_collections/git_cgallagher/inventory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # tags

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The ansible-core the collection is developed and sanity-tested with (server venv, CI).
      - name: Install ansible-core
        run: python -m pip install 'ansible-core==2.21.5'

      - name: Decide what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import yaml; print(yaml.safe_load(open('${COLLECTION}/galaxy.yml'))['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v${version} exists; nothing to do."
            if ! git diff --quiet "v${version}" HEAD -- "${COLLECTION}"; then
              echo "::notice::The collection changed since v${version}; bump version in galaxy.yml to release it."
            fi
            echo "action=none" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} exists without a release: building it from the tag."
            echo "action=from-tag" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${version}: tagging this commit."
            echo "action=new" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tag's tree
        if: steps.plan.outputs.action == 'from-tag'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: git checkout --quiet "v${VERSION}"

      - name: Build the collection
        if: steps.plan.outputs.action != 'none'
        working-directory: ${{ env.COLLECTION }}
        run: ansible-galaxy collection build --output-path "${RUNNER_TEMP}/dist"

      - name: Create the GitHub release
        if: steps.plan.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # --target only applies when the tag is new; an existing tag is reused as is.
          gh release create "v${VERSION}" "${RUNNER_TEMP}"/dist/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes "Collection git_cgallagher.inventory ${VERSION} (not on Ansible Galaxy). Install the attached tarball with \`ansible-galaxy collection install <url of the .tar.gz>\`. Server and UI at the same tag. See CHANGELOG.md."
