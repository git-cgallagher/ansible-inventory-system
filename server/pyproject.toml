[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-inventory-system"
version = "0.1.0"
description = "Authoritative, database-backed Ansible inventory with a strict tree hierarchy"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "ansible-core>=2.18",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8", "httpx>=0.27", "hypothesis>=6"]

[project.scripts]
ais = "ais.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ais*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
