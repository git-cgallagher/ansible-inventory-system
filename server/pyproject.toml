[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-inventory-system"
version = "0.4.1"
description = "Authoritative, database-backed Ansible inventory with a strict tree hierarchy"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "ansible-core>=2.19",  # trust_as_template, and the render guard (ais.render._guard)
  "alembic>=1.13",
  "email-validator>=2.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
oidc = ["authlib>=1.3", "itsdangerous>=2.1"]
test = ["pytest>=8", "httpx>=0.27", "hypothesis>=6"]

[project.scripts]
ais = "ais.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ais*"]

[tool.setuptools.package-data]
ais = ["migrations/script.py.mako", "static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
