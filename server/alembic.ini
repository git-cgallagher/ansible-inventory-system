# Hand use only: `alembic -c server/alembic.ini history`. `ais init-db` runs the same
# migrations programmatically; the URL comes from AIS_DATABASE_URL (see env.py).
[alembic]
script_location = %(here)s/ais/migrations
prepend_sys_path = %(here)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
